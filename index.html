<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Devocional Helper</title>

  <!-- PWA: instalável e com leitura offline -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#060709" />
  <meta name="description" content="Um versículo por dia, com contexto, favoritos e a Bíblia completa para leitura offline." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Devocional" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <div class="brand-zone">
        <span class="meta-label">MOMENTO</span>
        <h1 class="app-title">Devocional</h1>
      </div>

      <div class="header-selects">
        <div class="custom-dropdown" id="themeDropdown">
          <button class="custom-dropdown__trigger" id="themeDropdownTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="custom-dropdown__label" id="themeDropdownLabel">Todos os Temas</span>
            <span class="custom-dropdown__arrow">▾</span>
          </button>
          <div class="custom-dropdown__panel custom-dropdown__panel--themes" id="themeDropdownPanel" role="listbox"></div>
        </div>
        <div class="custom-dropdown custom-dropdown--right" id="versionDropdown">
          <button class="custom-dropdown__trigger" id="versionDropdownTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="custom-dropdown__label" id="versionDropdownLabel">ARA</span>
            <span class="custom-dropdown__arrow">▾</span>
          </button>
          <div class="custom-dropdown__panel custom-dropdown__panel--versions" id="versionDropdownPanel" role="listbox"></div>
        </div>
        <!-- O botão da Bíblia não entra aqui: no desktop ele já existe na
             barra de ações. Ele só aparece na faixa do mobile, onde sai
             do menu hamburguer para não ficar duplicado. -->
        <!-- selects ocultos para compatibilidade com script existente -->
        <select id="versionSelect" aria-label="Versão da Bíblia" style="display:none"></select>
      </div>

      <!-- Botão hamburguer: visível apenas em mobile ≤480px -->
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </header>

    <!-- Faixa de selects exclusiva do mobile, abaixo do header -->
    <div class="mobile-selects-bar">
      <div class="custom-dropdown" id="themeDropdownMobile">
        <button class="custom-dropdown__trigger" id="themeDropdownTriggerMobile" aria-haspopup="listbox" aria-expanded="false">
          <span class="custom-dropdown__label" id="themeDropdownLabelMobile">Temas</span>
          <span class="custom-dropdown__arrow">▾</span>
        </button>
        <div class="custom-dropdown__panel custom-dropdown__panel--themes" id="themeDropdownPanelMobile" role="listbox"></div>
      </div>
      <div class="custom-dropdown custom-dropdown--right" id="versionDropdownMobile">
        <button class="custom-dropdown__trigger" id="versionDropdownTriggerMobile" aria-haspopup="listbox" aria-expanded="false">
          <span class="custom-dropdown__label" id="versionDropdownLabelMobile">ARA</span>
          <span class="custom-dropdown__arrow">▾</span>
        </button>
        <div class="custom-dropdown__panel custom-dropdown__panel--versions" id="versionDropdownPanelMobile" role="listbox"></div>
      </div>
      <button class="header-bible-btn header-bible-btn--icon" onclick="openBibleReader()" title="Abrir a Bíblia" aria-label="Abrir a Bíblia">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Bíblia</span>
      </button>
      <!-- selects ocultos para compatibilidade -->
      <select id="versionSelectMobile" aria-label="Versão da Bíblia" style="display:none"></select>
    </div>


    <!-- Backdrop invisível que fecha o menu ao clicar fora -->
    <div class="hamburger-backdrop" id="hamburgerBackdrop"></div>

    <div class="action-toolbar" id="actionToolbar">

      <button class="action-btn" id="btnRandom" onclick="goRandom(); closeHamburgerMenu();">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="7" cy="7" r="1"/><circle cx="17" cy="17" r="1"/><circle cx="7" cy="17" r="1"/><circle cx="17" cy="7" r="1"/><circle cx="12" cy="12" r="1"/></svg>
        <span>Aleatório</span>
      </button>

      <div class="action-toolbar__divider" id="dividerBible"></div>

      <!-- No mobile este item some do menu hamburguer: lá a Bíblia já está
           na faixa de cima, ao lado de Temas e Versão. -->
      <button class="action-btn" id="btnBible" onclick="openBibleReader(); closeHamburgerMenu();">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Bíblia</span>
      </button>

      <div class="action-toolbar__divider"></div>

      <button class="action-btn" id="btnFavList" onclick="openFavoritesModal(); closeHamburgerMenu();">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Favoritos</span>
      </button>

      <div class="action-toolbar__divider"></div>

      <button class="action-btn" id="btnSearch" onclick="openSearchModal(); closeHamburgerMenu();">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <span>Buscar</span>
      </button>

      <div class="action-toolbar__divider"></div>

      <button class="action-btn" id="themeToggle" onclick="toggleDark()">
        <span id="modeIcon" style="font-size:13px;line-height:1;">☽</span>
        <span id="themeLabel">Modo Escuro</span>
      </button>
    </div>

    <main class="display-stage">
      <div class="workspace-card" id="card">

        <div class="card-top">
          <div class="meta-row">
            <span class="theme-badge" id="verseTheme">---</span>

            <div class="card-actions">
              <button class="context-btn" onclick="openContextModal()" title="Ler capítulo completo">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Passagem</span>
              </button>
              <div class="card-actions__divider"></div>
              <button class="fav-btn" id="favBtn" onclick="toggleFavorite()" title="Favoritar versículo">
                <svg class="icon-heart" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span id="favStatus">Favoritar</span>
              </button>
              <div class="card-actions__divider"></div>
              <button class="copy-btn" onclick="copyToClipboard()" title="Copiar Versículo">
                <svg class="icon-copy" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span id="copyStatus">Copiar</span>
              </button>
            </div>
          </div>

          <div class="verse-container">
            <p class="verse-main-text" id="verseText">Carregando conteúdo...</p>
            <h2 class="verse-reference" id="verseRef">---</h2>
          </div>
        </div>

        <div class="card-bottom">
          <div class="divider-line"></div>

          <div class="insight-block">
            <span class="insight-title">Contexto & Análise</span>
            <p class="insight-body" id="verseCtx">...</p>
          </div>

          <div class="related-block" id="relatedBlock" style="display:none">
            <div class="divider-line"></div>
            <span class="insight-title" style="margin-bottom:10px;display:block">Versículos Relacionados</span>
            <div class="related-list" id="relatedList"></div>
          </div>

        </div>

      </div>
    </main>

    <footer class="navigation-hub">
      <button class="nav-arrow-btn" id="btnPrev" onclick="go(-1)" aria-label="Anterior">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="timeline-tracker">
        <div class="timeline-meta">
          <span><strong id="dayNum">1</strong> / <span id="dayTotal">365</span></span>
        </div>
        <div class="timeline-bar">
          <div class="timeline-progress" id="progressFill"></div>
        </div>
      </div>

      <button class="nav-arrow-btn" id="btnNext" onclick="go(1)" aria-label="Próximo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l6 6-6 6"/></svg>
      </button>
    </footer>

  </div>

  <!-- MODAL: CAPÍTULO DO VERSÍCULO -->
  <div class="modal-overlay" id="contextModal" onclick="handleModalClick(event,'contextModal')">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title" id="contextTitle">Capítulo</span>
        <div class="reader-chapter-ctrl">
          <button class="reader-ch-btn" id="contextPrev" onclick="contextGo(-1)">‹</button>
          <span class="reader-ch-label" id="contextChapterLabel"></span>
          <button class="reader-ch-btn" id="contextNext" onclick="contextGo(1)">›</button>
        </div>
        <button class="modal-close" onclick="closeContextModal()">✕</button>
      </div>
      <div class="modal-body" id="contextBody">
        <div class="modal-loading">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- MODAL: LEITOR DE BÍBLIA (tela cheia) -->
  <div class="modal-overlay modal-overlay--reader" id="bibleModal" onclick="handleModalClick(event,'bibleModal')">
    <div class="modal-panel modal-panel--reader" id="readerPanel">

      <div class="reader-bar">
        <div class="reader-bar__top">
          <span class="reader-bar__title">Selecionar passagem</span>
          <button class="reader-ref-btn" id="readerRefBtn" onclick="renderBookPanel()" title="Trocar livro / capítulo / versículo">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span id="readerRefLabel">Selecionar passagem</span>
            <svg class="reader-ref-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button class="modal-close" onclick="closeBibleReader()">✕</button>
        </div>

        <div class="reader-bar__scale">
          <div class="font-scale">
            <span class="font-scale__a font-scale__a--sm">A</span>
            <input type="range" class="font-scale__input" id="fontScaleInput"
                   min="1" max="5" step="1" value="3"
                   aria-label="Tamanho do texto"
                   oninput="setReadingScale(this.value)" />
            <span class="font-scale__a font-scale__a--lg">A</span>
            <span class="font-scale__label" id="fontScaleLabel">Médio</span>
          </div>
        </div>
      </div>

      <div class="modal-body" id="readerBody">
        <div class="modal-loading">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- MODAL: FAVORITOS -->
  <div class="modal-overlay" id="favoritesModal" onclick="handleModalClick(event,'favoritesModal')">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-2);margin-right:6px;vertical-align:middle"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Favoritos
        </span>
        <button class="modal-close" onclick="closeFavoritesModal()">✕</button>
      </div>
      <div class="modal-body" id="favoritesBody">
        <div class="modal-loading">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- MODAL: BUSCA -->
  <div class="modal-overlay" id="searchModal" onclick="handleModalClick(event,'searchModal')">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:middle"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          Buscar Versículos
        </span>
        <button class="modal-close" onclick="closeSearchModal()">✕</button>
      </div>
      <div class="search-input-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por palavra, referência ou tema..." oninput="onSearchInput()" autocomplete="off" />
      </div>
      <div class="modal-body" id="searchBody">
        <p class="search-hint">Digite para buscar entre os 365 versículos.</p>
      </div>
    </div>
  </div>

  <script src="versiculos.js"></script>
  <script src="script.js"></script>

  <!-- Registro do service worker: sem ele o app não abre offline -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .catch(err => console.warn("Service worker não registrado:", err));
      });
    }
  </script>
</body>
</html>
