<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Devocional</title>

  <!-- PWA: instalável e com leitura offline -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#F5F0E6" id="metaTheme" />
  <meta name="description" content="Um versículo por dia, com reflexão, favoritos e a Bíblia completa para leitura offline." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Devocional" />

  <!-- Aplica o tema antes de pintar, para não piscar claro/escuro -->
  <script>
    (function () {
      var m = "system";
      try { m = localStorage.getItem("devocional-mode") || "system"; } catch (e) {}
      if (m === "system") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", m);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ícones (usados com <svg><use href="#i-nome"/></svg>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sunrise" viewBox="0 0 24 24"><path d="M12 2v6M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.6-4.6"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
      <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-today" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    </defs>
  </svg>

  <!-- ── Cabeçalho ── -->
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#hoje" aria-label="Devocional — início">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Devocional</span>
      </a>

      <!-- Navegação no desktop (no celular ela fica embaixo) -->
      <nav class="topnav" aria-label="Seções">
        <a href="#hoje"   data-nav="hoje">Hoje</a>
        <a href="#biblia" data-nav="biblia">Bíblia</a>
        <a href="#busca"  data-nav="busca">Buscar</a>
        <a href="#salvos" data-nav="salvos">Salvos</a>
      </nav>

      <div class="topbar__tools">
        <button class="pill-btn" id="versionBtn" aria-label="Trocar versão da Bíblia">
          <span id="versionLabel">ARA</span>
          <svg class="i" width="12" height="12"><use href="#i-chev-d"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" aria-label="Preferências">
          <svg class="i" width="19" height="19"><use href="#i-sliders"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="app">

    <!-- ═════════════ HOJE ═════════════ -->
    <section class="view" id="view-hoje" data-view="hoje" aria-label="Devocional do dia">

      <div class="today-head">
        <div>
          <p class="eyebrow" id="todayDate">&nbsp;</p>
          <h1 class="display" id="todayTitle">Palavra de hoje</h1>
        </div>
        <button class="streak" id="streakBtn" aria-label="Sua sequência de leitura">
          <svg class="i" width="16" height="16"><use href="#i-flame"/></svg>
          <span id="streakNum">0</span>
        </button>
      </div>

      <div class="week" id="weekStrip" aria-label="Leituras desta semana"></div>

      <div class="chips-wrap">
        <div class="chips" id="themeChips" role="listbox" aria-label="Filtrar por tema"></div>
      </div>

      <article class="verse-card" id="card">
        <div class="verse-card__meta">
          <span class="tag" id="verseTheme">—</span>
        </div>

        <blockquote class="verse-text" id="verseText">
          <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton skeleton--short"></span>
        </blockquote>
        <p class="verse-ref"><span id="verseRef">—</span> <span class="verse-ref__ver" id="verseVer">ARA</span></p>

        <div class="verse-actions">
          <button class="act" id="favBtn" aria-pressed="false">
            <svg class="i" width="18" height="18"><use href="#i-heart"/></svg>
            <span id="favLabel">Salvar</span>
          </button>
          <button class="act" id="copyBtn">
            <svg class="i" width="18" height="18"><use href="#i-copy"/></svg>
            <span>Copiar</span>
          </button>
          <button class="act" id="shareBtn">
            <svg class="i" width="18" height="18"><use href="#i-share"/></svg>
            <span>Compartilhar</span>
          </button>
          <button class="act" id="chapterBtn">
            <svg class="i" width="18" height="18"><use href="#i-book"/></svg>
            <span>Capítulo</span>
          </button>
        </div>
      </article>

      <div class="pager">
        <button class="round-btn" id="prevBtn" aria-label="Versículo anterior">
          <svg class="i" width="18" height="18"><use href="#i-chev-l"/></svg>
        </button>
        <div class="pager__mid">
          <div class="pager__bar"><div class="pager__fill" id="progressFill"></div></div>
          <div class="pager__row">
            <span class="pager__count" id="verseCount"></span>
            <button class="text-btn" id="todayBtn" hidden>
              <svg class="i" width="13" height="13"><use href="#i-today"/></svg> Voltar para hoje
            </button>
            <button class="text-btn" id="randomBtn">
              <svg class="i" width="13" height="13"><use href="#i-shuffle"/></svg> Aleatório
            </button>
          </div>
        </div>
        <button class="round-btn" id="nextBtn" aria-label="Próximo versículo">
          <svg class="i" width="18" height="18"><use href="#i-chev-r"/></svg>
        </button>
      </div>

      <section class="reflection">
        <h2 class="section-label">Reflexão</h2>
        <p class="reflection__body" id="verseCtx"></p>

        <button class="done-btn" id="doneBtn">
          <span class="done-btn__box"><svg class="i" width="14" height="14"><use href="#i-check"/></svg></span>
          <span id="doneLabel">Marcar a leitura de hoje como feita</span>
        </button>
      </section>

      <section class="related" id="relatedBlock" hidden>
        <h2 class="section-label">Continue no tema</h2>
        <div class="related__list" id="relatedList"></div>
      </section>
    </section>

    <!-- ═════════════ BÍBLIA ═════════════ -->
    <section class="view" id="view-biblia" data-view="biblia" aria-label="Bíblia" hidden>
      <div id="bibleBody"></div>
    </section>

    <!-- ═════════════ BUSCA ═════════════ -->
    <section class="view" id="view-busca" data-view="busca" aria-label="Buscar" hidden>
      <div class="search-head">
        <h1 class="display">Buscar</h1>
        <label class="search-field">
          <svg class="i" width="18" height="18"><use href="#i-search"/></svg>
          <input type="search" id="searchInput" placeholder="Palavra, tema ou referência (ex: jo 3:16)" autocomplete="off" enterkeyhint="search" />
          <button class="search-field__clear" id="searchClear" aria-label="Limpar busca" hidden>
            <svg class="i" width="14" height="14"><use href="#i-x"/></svg>
          </button>
        </label>
        <div class="segmented" role="tablist" aria-label="Onde buscar">
          <button role="tab" class="is-on" data-scope="dev" aria-selected="true">Devocionais</button>
          <button role="tab" data-scope="bible" aria-selected="false">Bíblia inteira</button>
        </div>
      </div>
      <div id="searchResults" class="search-results" aria-live="polite"></div>
    </section>

    <!-- ═════════════ SALVOS ═════════════ -->
    <section class="view" id="view-salvos" data-view="salvos" aria-label="Salvos" hidden>
      <div class="saved-head">
        <h1 class="display">Salvos</h1>
        <p class="muted" id="savedCount"></p>
      </div>
      <div class="segmented segmented--sm" id="savedFilter" role="tablist" aria-label="Filtrar salvos">
        <button role="tab" class="is-on" data-filter="all" aria-selected="true">Todos</button>
        <button role="tab" data-filter="dev" aria-selected="false">Devocionais</button>
        <button role="tab" data-filter="bible" aria-selected="false">Da Bíblia</button>
      </div>
      <div id="savedList" class="saved-list"></div>
    </section>

  </main>

  <!-- Barra de seleção de versículos (leitor) -->
  <div class="selbar" id="selBar" aria-live="polite">
    <button class="icon-btn icon-btn--sm" id="selClear" aria-label="Limpar seleção">
      <svg class="i" width="16" height="16"><use href="#i-x"/></svg>
    </button>
    <span class="selbar__ref" id="selRef"></span>
    <div class="selbar__acts">
      <button class="icon-btn icon-btn--sm" id="selFav" aria-label="Salvar seleção"><svg class="i" width="17" height="17"><use href="#i-heart"/></svg></button>
      <button class="icon-btn icon-btn--sm" id="selCopy" aria-label="Copiar seleção"><svg class="i" width="17" height="17"><use href="#i-copy"/></svg></button>
      <button class="icon-btn icon-btn--sm" id="selShare" aria-label="Compartilhar seleção"><svg class="i" width="17" height="17"><use href="#i-share"/></svg></button>
    </div>
  </div>

  <!-- Abas do celular -->
  <nav class="tabbar" aria-label="Seções">
    <a href="#hoje" data-nav="hoje">
      <svg class="i" width="22" height="22"><use href="#i-sunrise"/></svg><span>Hoje</span>
    </a>
    <a href="#biblia" data-nav="biblia">
      <svg class="i" width="22" height="22"><use href="#i-book"/></svg><span>Bíblia</span>
    </a>
    <a href="#busca" data-nav="busca">
      <svg class="i" width="22" height="22"><use href="#i-search"/></svg><span>Buscar</span>
    </a>
    <a href="#salvos" data-nav="salvos">
      <svg class="i" width="22" height="22"><use href="#i-heart"/></svg><span>Salvos</span>
    </a>
  </nav>

  <!-- Folha inferior genérica (preferências, compartilhar, capítulos) -->
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__grip" aria-hidden="true"></div>
      <div class="sheet__head">
        <h2 class="sheet__title" id="sheetTitle"></h2>
        <button class="icon-btn icon-btn--sm" data-close aria-label="Fechar">
          <svg class="i" width="16" height="16"><use href="#i-x"/></svg>
        </button>
      </div>
      <div class="sheet__body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="importInput" accept="application/json,.json" hidden />

  <script src="versiculos.js"></script>
  <script src="script.js"></script>

  <!-- Registro do service worker: sem ele o app não abre offline -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .catch(err => console.warn("Service worker não registrado:", err));
      });
    }
  </script>
</body>
</html>
