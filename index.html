<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Devocional Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <div class="brand-zone">
        <span class="meta-label">MOMENTO</span>
        <h1 class="app-title">Devocional</h1>
      </div>

      <div class="header-selects">
        <div class="select-custom">
          <select id="themeFilter" aria-label="Filtrar por Tema">
            <option value="Todos">Todos os Temas</option>
          </select>
        </div>
        <div class="select-custom">
          <select id="versionSelect" aria-label="Versão da Bíblia">
          </select>
        </div>
      </div>
    </header>

    <div class="action-toolbar">
      <button class="action-btn" id="btnRandom" onclick="goRandom()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="7" cy="7" r="1"/><circle cx="17" cy="17" r="1"/><circle cx="7" cy="17" r="1"/><circle cx="17" cy="7" r="1"/><circle cx="12" cy="12" r="1"/></svg>
        <span>Aleatório</span>
      </button>

      <div class="action-toolbar__divider"></div>

      <button class="action-btn" id="btnBible" onclick="openBibleReader()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Bíblia</span>
      </button>

      <div class="action-toolbar__divider"></div>

      <button class="action-btn" id="btnFavList" onclick="openFavoritesModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Favoritos</span>
      </button>

      <div class="action-toolbar__divider"></div>

      <button class="action-btn" id="themeToggle" onclick="toggleDark()">
        <span id="modeIcon" style="font-size:13px;line-height:1;">☽</span>
        <span id="themeLabel">Modo Escuro</span>
      </button>
    </div>

    <main class="display-stage">
      <div class="workspace-card" id="card">
        
        <div class="card-top">
          <div class="meta-row">
            <span class="theme-badge" id="verseTheme">---</span>
            
            <div class="card-actions">
              <button class="context-btn" onclick="openContextModal()" title="Ler capítulo completo">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Abrir Passagem</span>
              </button>
              <button class="fav-btn" id="favBtn" onclick="toggleFavorite()" title="Favoritar versículo">
                <svg class="icon-heart" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span id="favStatus">Favoritar</span>
              </button>
              <button class="copy-btn" onclick="copyToClipboard()" title="Copiar Versículo">
                <svg class="icon-copy" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span id="copyStatus">Copiar</span>
              </button>
            </div>
          </div>

          <div class="verse-container">
            <p class="verse-main-text" id="verseText">Carregando conteúdo...</p>
            <h2 class="verse-reference" id="verseRef">---</h2>
          </div>
        </div>

        <div class="card-bottom">
          <div class="divider-line"></div>
          
          <div class="insight-block">
            <span class="insight-title">Contexto & Análise</span>
            <p class="insight-body" id="verseCtx">...</p>
          </div>
        </div>

      </div>
    </main>

    <footer class="navigation-hub">
      <button class="nav-arrow-btn" id="btnPrev" onclick="go(-1)" aria-label="Anterior">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="timeline-tracker">
        <div class="timeline-meta">
          <span>Dia <strong id="dayNum">1</strong> de 365</span>
        </div>
        <div class="timeline-bar">
          <div class="timeline-progress" id="progressFill"></div>
        </div>
        <div class="timeline-counter" id="navIndex">0 / 0</div>
      </div>

      <button class="nav-arrow-btn" id="btnNext" onclick="go(1)" aria-label="Próximo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l6 6-6 6"/></svg>
      </button>
    </footer>

  </div>

  <!-- MODAL: CAPÍTULO DO VERSÍCULO -->
  <div class="modal-overlay" id="contextModal" onclick="handleModalClick(event,'contextModal')">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title" id="contextTitle">Capítulo</span>
        <div class="reader-chapter-ctrl">
          <button class="reader-ch-btn" id="contextPrev" onclick="contextGo(-1)">‹</button>
          <span class="reader-ch-label" id="contextChapterLabel"></span>
          <button class="reader-ch-btn" id="contextNext" onclick="contextGo(1)">›</button>
        </div>
        <button class="modal-close" onclick="closeContextModal()">✕</button>
      </div>
      <div class="modal-body" id="contextBody">
        <div class="modal-loading">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- MODAL: LEITOR DE BÍBLIA -->
  <div class="modal-overlay" id="bibleModal" onclick="handleModalClick(event,'bibleModal')">
    <div class="modal-panel modal-panel--wide">
      <div class="modal-header">
        <button class="reader-ref-btn" id="readerRefBtn" onclick="renderBookPanel()" title="Trocar livro / capítulo / versículo">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span id="readerRefLabel">Selecionar passagem</span>
          <svg class="reader-ref-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="modal-close" onclick="closeBibleReader()">✕</button>
      </div>
      <div class="modal-body" id="readerBody">
        <div class="modal-loading">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- MODAL: FAVORITOS -->
  <div class="modal-overlay" id="favoritesModal" onclick="handleModalClick(event,'favoritesModal')">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-2);margin-right:6px;vertical-align:middle"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Favoritos
        </span>
        <button class="modal-close" onclick="closeFavoritesModal()">✕</button>
      </div>
      <div class="modal-body" id="favoritesBody">
        <div class="modal-loading">Carregando...</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function handleModalClick(e, modalId) {
      if (e.target.id === modalId) {
        if (modalId === 'contextModal') closeContextModal();
        else if (modalId === 'favoritesModal') closeFavoritesModal();
        else closeBibleReader();
      }
    }
  </script>
</body>
</html>
